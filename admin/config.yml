backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "en"

collections:
  - name: "stories"
    label: "కథలు (Stories)"
    label_singular: "కథ (Story)"
    folder: "content/stories"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Title (కథ పేరు)", name: "title", widget: "string" }
      - { label: "URL Slug (English, no spaces — e.g. my-story-name)", name: "slug", widget: "string" }
      - { label: "Poster Image", name: "poster", widget: "image" }
      - { label: "Poster Thumbnail (for home page card)", name: "posterThumb", widget: "image" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: ["కథ"]
      - { label: "One-line hook (shown
