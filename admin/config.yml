backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: "en"

collections:
  - name: "stories"
    label: "కథలు (Stories)"
    label_singular: "కథ (Story)"
    folder: "content/stories"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "title"
    fields:
      - { label: "Title (కథ పేరు)", name: "title", widget: "string" }
      - { label: "URL Slug (English, no spaces — e.g. my-story-name)", name: "slug", widget: "string" }
      - { label: "Poster Image", name: "poster", widget: "image" }
      - { label: "Poster Thumbnail (for home page card)", name: "posterThumb", widget: "image" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: ["కథ"]
      - { label: "One-line hook (shown on home page card)", name: "hook", widget: "text" }
      - label: "Episodes"
        name: "episodes"
        widget: "list"
        summary: "{{title}} — {{fields.status}}"
        fields:
          - { label: "Episode Title", name: "title", widget: "string" }
          - label: "Status"
            name: "status"
            widget: "select"
            options: ["locked", "published"]
            default: "locked"
          - { label: "Byline (usually only Episode 1)", name: "byline", widget: "string", required: false, default: "" }
          - label: "Episode Text"
            name: "body"
            widget: "text"
            hint: "Separate paragraphs with a blank line. Type ---  on its own line for a section divider."

  - name: "site"
    label: "సైట్ సెట్టింగ్‌లు (Site Settings)"
    files:
      - name: "general"
        label: "General"
        file: "content/site.json"
        fields:
          - { label: "Brand name (nav bar)", name: "brand", widget: "string" }
          - { label: "Kicker (small line above headline)", name: "kicker", widget: "string" }
          - { label: "Headline — line 1", name: "heroLine1", widget: "string" }
          - { label: "Headline — line 2", name: "heroLine2", widget: "string" }
          - { label: "Subtext under headline", name: "heroSub", widget: "text" }
          - { label: "Author name", name: "authorName", widget: "string" }
          - label: "About page bio paragraphs"
            name: "aboutBio"
            widget: "list"
